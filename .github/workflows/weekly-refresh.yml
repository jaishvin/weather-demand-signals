name: Weekly refresh

on:
  schedule:
    - cron: "17 2 * * 1"     # every Monday 02:17 UTC (07:47 IST)
  workflow_dispatch:          # "Run workflow" button for manual runs
  push:                       # run the tests when the code changes
    paths:
      - "pipeline/**"
      - "tests/**"

permissions:
  contents: write             # lets the job commit the refreshed data and report

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run pipeline
        if: github.event_name != 'push'
        run: python -m pipeline.main

      - name: Commit refreshed data and report
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports README.md
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%Y-%m-%d)"
          git push
